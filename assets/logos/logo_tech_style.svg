<?xml version="1.0" encoding="UTF-8"?>
<svg width="450" height="200" viewBox="0 0 450 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="techGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <pattern id="circuitPattern" patternUnits="userSpaceOnUse" width="40" height="40">
      <rect width="40" height="40" fill="#F8FAFC"/>
      <path d="M 0 20 L 20 20 L 20 0 M 20 20 L 40 20 M 20 20 L 20 40" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="20" cy="20" r="2" fill="#CBD5E1"/>
    </pattern>
  </defs>
  
  <!-- Background with circuit pattern -->
  <rect x="0" y="0" width="450" height="200" fill="url(#circuitPattern)" opacity="0.3"/>
  
  <!-- Main background -->
  <rect x="25" y="25" width="400" height="150" fill="#FFFFFF" rx="15" opacity="0.95"/>
  
  <!-- Circuit lines connecting the three C's -->
  <g stroke="url(#techGradient)" stroke-width="3" fill="none" opacity="0.6">
    <path d="M 80 80 L 120 80 L 140 100 L 180 100"/>
    <path d="M 180 100 L 220 100 L 240 80 L 280 80"/>
    <path d="M 280 80 L 320 80 L 340 100 L 380 100"/>
  </g>
  
  <!-- Code section -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="80" height="50" rx="10" fill="#4F46E5" opacity="0.1"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#4F46E5">CODE</text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4F46E5">Programming</text>
    <circle cx="80" cy="25" r="4" fill="#4F46E5"/>
  </g>
  
  <!-- Connect section -->
  <g transform="translate(150, 80)">
    <rect x="0" y="0" width="100" height="50" rx="10" fill="#7C3AED" opacity="0.1"/>
    <text x="50" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#7C3AED">CONNECT</text>
    <text x="50" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7C3AED">IoT & Networks</text>
    <circle cx="0" cy="25" r="4" fill="#7C3AED"/>
    <circle cx="100" cy="25" r="4" fill="#7C3AED"/>
  </g>
  
  <!-- Create section -->
  <g transform="translate(280, 60)">
    <rect x="0" y="0" width="80" height="50" rx="10" fill="#EC4899" opacity="0.1"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#EC4899">CREATE</text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#EC4899">Innovation</text>
    <circle cx="0" cy="25" r="4" fill="#EC4899"/>
  </g>
  
  <!-- Main title -->
  <text x="225" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#techGradient)">
    Code • Connect • Create
  </text>
  
  <!-- Subtitle -->
  <text x="225" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">
    Apps • IoT • Robotics Youth Program
  </text>
  
  <!-- Tech decorations -->
  <g fill="#CBD5E1">
    <circle cx="30" cy="30" r="2"/>
    <circle cx="420" cy="30" r="2"/>
    <circle cx="30" cy="170" r="2"/>
    <circle cx="420" cy="170" r="2"/>
  </g>
</svg>