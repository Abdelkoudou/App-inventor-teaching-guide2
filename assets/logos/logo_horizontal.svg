<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="80" viewBox="0 0 600 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="horizontalGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background bar -->
  <rect x="0" y="0" width="600" height="80" fill="#F8FAFC" rx="10"/>
  
  <!-- Left decorative element -->
  <g transform="translate(20, 20)">
    <!-- Gear icon representing robotics -->
    <circle cx="20" cy="20" r="15" fill="#4F46E5" opacity="0.1"/>
    <polygon points="20,8 24,12 24,16 28,20 24,24 24,28 20,32 16,28 16,24 12,20 16,16 16,12" fill="#4F46E5"/>
    <circle cx="20" cy="20" r="6" fill="#FFFFFF"/>
    <circle cx="20" cy="20" r="3" fill="#4F46E5"/>
  </g>
  
  <!-- Main title -->
  <text x="300" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#horizontalGradient)">
    Code • Connect • Create
  </text>
  
  <!-- Subtitle -->
  <text x="300" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">
    Apps • IoT • Robotics | Youth Development Program
  </text>
  
  <!-- Right decorative elements -->
  <g transform="translate(540, 20)">
    <!-- Mobile app icon -->
    <rect x="0" y="5" width="15" height="25" rx="3" fill="#7C3AED" opacity="0.2"/>
    <rect x="2" y="8" width="11" height="16" fill="#7C3AED" opacity="0.4"/>
    <circle cx="7.5" cy="28" r="1.5" fill="#7C3AED"/>
    
    <!-- WiFi/IoT signal icon -->
    <g transform="translate(25, 0)">
      <path d="M 7.5 30 A 15 15 0 0 0 22.5 15" stroke="#EC4899" stroke-width="2" fill="none" opacity="0.6"/>
      <path d="M 7.5 30 A 10 10 0 0 0 17.5 20" stroke="#EC4899" stroke-width="2" fill="none" opacity="0.8"/>
      <circle cx="7.5" cy="30" r="2" fill="#EC4899"/>
    </g>
  </g>
  
  <!-- Tech accent line -->
  <rect x="0" y="75" width="600" height="5" fill="url(#horizontalGradient)" opacity="0.3"/>
</svg>