<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main title -->
  <text x="200" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="url(#textGradient)">
    Code • Connect • Create
  </text>
  
  <!-- Subtitle -->
  <text x="200" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">
    Apps • IoT • Robotics
  </text>
  
  <!-- Decorative dots -->
  <circle cx="80" cy="42" r="3" fill="#4F46E5"/>
  <circle cx="320" cy="42" r="3" fill="#EC4899"/>
  
  <!-- Youth program indicator -->
  <text x="200" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF">
    Youth Development Program
  </text>
</svg>