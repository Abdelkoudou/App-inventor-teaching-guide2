<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="150" viewBox="0 0 500 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Code Icon (left) -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="60" height="40" rx="8" fill="#4F46E5" opacity="0.1"/>
    <text x="30" y="25" text-anchor="middle" font-family="monospace" font-size="12" fill="#4F46E5">&lt;/&gt;</text>
    <text x="30" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4F46E5">CODE</text>
  </g>
  
  <!-- Connect Icon (center) -->
  <g transform="translate(220, 40)">
    <circle cx="15" cy="20" r="8" fill="#7C3AED" opacity="0.2"/>
    <circle cx="45" cy="20" r="8" fill="#7C3AED" opacity="0.2"/>
    <line x1="23" y1="20" x2="37" y2="20" stroke="#7C3AED" stroke-width="3"/>
    <circle cx="15" cy="20" r="3" fill="#7C3AED"/>
    <circle cx="45" cy="20" r="3" fill="#7C3AED"/>
    <text x="30" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7C3AED">CONNECT</text>
  </g>
  
  <!-- Create Icon (right) -->
  <g transform="translate(380, 40)">
    <polygon points="30,5 35,20 50,20 38,30 43,45 30,37 17,45 22,30 10,20 25,20" fill="#EC4899" opacity="0.2"/>
    <circle cx="30" cy="25" r="15" fill="none" stroke="#EC4899" stroke-width="2"/>
    <text x="30" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#EC4899">CREATE</text>
  </g>
  
  <!-- Main title -->
  <text x="250" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#titleGradient)">
    Code • Connect • Create
  </text>
  
  <!-- Subtitle -->
  <text x="250" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6B7280">
    Apps • IoT • Robotics Education
  </text>
  
  <!-- Program line -->
  <text x="250" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF">
    Youth Development Program
  </text>
</svg>