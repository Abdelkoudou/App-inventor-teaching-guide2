<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="codeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="connectGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D9488;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="createGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DC2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EA580C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle for cohesion -->
  <circle cx="200" cy="60" r="55" fill="none" stroke="#E5E7EB" stroke-width="2" opacity="0.3"/>
  
  <!-- CODE Section (Left) -->
  <g id="code-section">
    <!-- Code brackets -->
    <path d="M25 35 L15 45 L25 55" stroke="url(#codeGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M45 35 L55 45 L45 55" stroke="url(#codeGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Binary pattern -->
    <circle cx="32" cy="40" r="2" fill="url(#codeGradient)"/>
    <circle cx="38" cy="40" r="2" fill="url(#codeGradient)" opacity="0.6"/>
    <circle cx="32" cy="50" r="2" fill="url(#codeGradient)" opacity="0.6"/>
    <circle cx="38" cy="50" r="2" fill="url(#codeGradient)"/>
    
    <!-- Mobile app icon -->
    <rect x="25" y="65" width="20" height="30" rx="4" fill="url(#codeGradient)" opacity="0.8"/>
    <rect x="28" y="68" width="14" height="20" rx="1" fill="white"/>
    <circle cx="35" cy="91" r="2" fill="white"/>
    
    <!-- Text -->
    <text x="35" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="url(#codeGradient)">CODE</text>
  </g>
  
  <!-- CONNECT Section (Center) -->
  <g id="connect-section">
    <!-- Network nodes -->
    <circle cx="180" cy="35" r="4" fill="url(#connectGradient)"/>
    <circle cx="200" cy="25" r="4" fill="url(#connectGradient)"/>
    <circle cx="220" cy="35" r="4" fill="url(#connectGradient)"/>
    <circle cx="190" cy="50" r="4" fill="url(#connectGradient)"/>
    <circle cx="210" cy="50" r="4" fill="url(#connectGradient)"/>
    
    <!-- Connection lines -->
    <line x1="180" y1="35" x2="200" y2="25" stroke="url(#connectGradient)" stroke-width="2"/>
    <line x1="200" y1="25" x2="220" y2="35" stroke="url(#connectGradient)" stroke-width="2"/>
    <line x1="180" y1="35" x2="190" y2="50" stroke="url(#connectGradient)" stroke-width="2"/>
    <line x1="220" y1="35" x2="210" y2="50" stroke="url(#connectGradient)" stroke-width="2"/>
    <line x1="190" y1="50" x2="210" y2="50" stroke="url(#connectGradient)" stroke-width="2"/>
    
    <!-- WiFi/Bluetooth symbol -->
    <path d="M190 70 Q200 65 210 70" stroke="url(#connectGradient)" stroke-width="2" fill="none"/>
    <path d="M185 75 Q200 65 215 75" stroke="url(#connectGradient)" stroke-width="2" fill="none"/>
    <path d="M180 80 Q200 65 220 80" stroke="url(#connectGradient)" stroke-width="2" fill="none"/>
    <circle cx="200" cy="82" r="2" fill="url(#connectGradient)"/>
    
    <!-- ESP32 representation -->
    <rect x="190" y="88" width="20" height="8" rx="2" fill="url(#connectGradient)"/>
    <rect x="192" y="90" width="4" height="4" fill="white"/>
    <rect x="204" y="90" width="4" height="4" fill="white"/>
    
    <!-- Text -->
    <text x="200" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="url(#connectGradient)">CONNECT</text>
  </g>
  
  <!-- CREATE Section (Right) -->
  <g id="create-section">
    <!-- Lightbulb (creativity) -->
    <ellipse cx="360" cy="35" rx="8" ry="12" fill="url(#createGradient)" opacity="0.8"/>
    <rect x="356" y="45" width="8" height="4" fill="url(#createGradient)"/>
    <rect x="354" y="49" width="12" height="2" fill="url(#createGradient)"/>
    
    <!-- Gear (engineering) -->
    <g transform="translate(340, 55)">
      <circle cx="0" cy="0" r="8" fill="url(#createGradient)"/>
      <circle cx="0" cy="0" r="4" fill="white"/>
      <!-- Gear teeth -->
      <rect x="-2" y="-10" width="4" height="4" fill="url(#createGradient)"/>
      <rect x="-2" y="6" width="4" height="4" fill="url(#createGradient)"/>
      <rect x="-10" y="-2" width="4" height="4" fill="url(#createGradient)"/>
      <rect x="6" y="-2" width="4" height="4" fill="url(#createGradient)"/>
    </g>
    
    <!-- Robot/IoT device -->
    <rect x="370" y="65" width="16" height="20" rx="3" fill="url(#createGradient)" opacity="0.8"/>
    <circle cx="375" cy="72" r="2" fill="white"/>
    <circle cx="381" cy="72" r="2" fill="white"/>
    <rect x="372" y="78" width="8" height="2" rx="1" fill="white"/>
    
    <!-- Antenna -->
    <line x1="378" y1="65" x2="378" y2="58" stroke="url(#createGradient)" stroke-width="2"/>
    <circle cx="378" cy="56" r="2" fill="url(#createGradient)"/>
    
    <!-- Text -->
    <text x="365" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="url(#createGradient)">CREATE</text>
  </g>
  
  <!-- Connecting dots between sections -->
  <circle cx="80" cy="60" r="3" fill="#94A3B8"/>
  <circle cx="120" cy="60" r="3" fill="#94A3B8"/>
  <circle cx="280" cy="60" r="3" fill="#94A3B8"/>
  <circle cx="320" cy="60" r="3" fill="#94A3B8"/>
  
  <!-- Decorative elements -->
  <path d="M75 55 L125 55" stroke="#E5E7EB" stroke-width="2" opacity="0.5"/>
  <path d="M275 55 L325 55" stroke="#E5E7EB" stroke-width="2" opacity="0.5"/>
</svg>